# ---------------------------------------------------------------------------
# Local / production Docker Compose — Second Brain RAG
# ---------------------------------------------------------------------------
# Usage:
#   cp .env.example .env          # fill in secrets (GROQ_API_KEY, JWT_SECRET_KEY)
#   docker compose up --build -d
#
# Secrets (GROQ_API_KEY, JWT_SECRET_KEY, POSTGRES_PASSWORD) are read from
# the host's .env file via `env_file:` below.  They are NEVER committed to
# git and never appear in the compose file itself.
# ---------------------------------------------------------------------------

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: secondbrain_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain -d secondbrain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Qdrant — vector store
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — caching, rate-limiting, future RQ broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/storage/uploads
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      CACHE_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      TASK_WORKER: pool
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # RQ Worker — separate process for background document ingestion
  # ---------------------------------------------------------------------------
  rq-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: >
      python -c "from src.workers.rq_worker import run_rq_worker; run_rq_worker()"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      TASK_WORKER: rq
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend — Next.js SPA
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  upload_data:
