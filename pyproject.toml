[project]
name = "second-brain"
version = "0.1.0"
description = "Backend for a multi-user Personal Knowledge Management (Second Brain) AI platform."
requires-python = ">=3.11"
dependencies = [
    "groq>=1.6.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: opt-in end-to-end tests requiring a real Qdrant server and model weights (pytest --run-live)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
